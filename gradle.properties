group = com.bloxbean.cardano
artifactId = yaci
version = 0.4.6-SNAPSHOT

# Release side effect of a v* tag, independent of the Maven Central deployment. The Central deployment
# is always staged (closed, never released) and needs a human to publish it, but the GitHub release is
# public the moment the tag is pushed. Set to false to rehearse the release pipeline end to end without
# publishing anything.
github_release = true
