<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:740px;height:387px;background:#FFFFFF;" width="740px" height="387px" viewBox="0 0 740 387" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="8"><text x="118.144" y="20.78" fill="#000" font-size="14" textLength="496.713" font-weight="700" font-family="Helvetica">A certifying block before and after (inlineEndorserBlockTxs = true, default)</text></g><!--entity wire--><g class="entity" data-qualified-name="wire" id="ent0001" data-source-line="11"><rect x="6" y="103" width="155.413" height="132" fill="#E9DDFF" style="stroke:#555;stroke-width:0.5;" rx="4" ry="4"/><text x="16" y="123.78" fill="#000" font-size="14" textLength="133.41" font-weight="700" font-family="Helvetica">On the wire: RB n+1</text><text x="16" y="137.78" fill="#000" font-size="14" font-family="Helvetica"> </text><text x="16" y="151.78" fill="#000" font-size="14" textLength="43.593" font-family="Helvetica">header</text><text x="27.669" y="165.78" fill="#000" font-size="14" textLength="89.1" font-family="Helvetica">certified = true</text><text x="27.669" y="179.78" fill="#000" font-size="14" textLength="123.744" font-family="Helvetica">body size 169 bytes</text><text x="16" y="193.78" fill="#000" font-size="14" textLength="30.358" font-family="Helvetica">body</text><text x="27.669" y="207.78" fill="#000" font-size="14" textLength="91.041" font-family="Helvetica">transactions: []</text><text x="27.669" y="221.78" fill="#000" font-size="14" textLength="97.269" font-family="Helvetica">Leios certificate</text></g><!--entity out--><g class="entity" data-qualified-name="out" id="ent0002" data-source-line="13"><rect x="380" y="47" width="289.247" height="244" fill="#D5F5E3" style="stroke:#555;stroke-width:0.5;" rx="4" ry="4"/><text x="390" y="67.78" fill="#000" font-size="14" textLength="139.255" font-weight="700" font-family="Helvetica">Delivered to onBlock</text><text x="390" y="81.78" fill="#000" font-size="14" font-family="Helvetica"> </text><text x="390" y="95.78" fill="#000" font-size="14" textLength="223.337" font-family="Helvetica">header                          (unchanged)</text><text x="401.669" y="109.78" fill="#000" font-size="14" textLength="257.578" font-family="Helvetica">blockBodySize / blockBodyHash describe</text><text x="401.669" y="123.78" fill="#000" font-size="14" textLength="111.303" font-family="Helvetica">the on-chain body</text><text x="390" y="137.78" fill="#000" font-size="14" textLength="260.688" font-family="Helvetica">transactionBodies     [0 .. 5254] from EB A</text><text x="390" y="151.78" fill="#000" font-size="14" textLength="196.096" font-family="Helvetica">transactionWitness    [0 .. 5254]</text><text x="390" y="165.78" fill="#000" font-size="14" textLength="261.064" font-family="Helvetica">auxiliaryDataMap      keys = merged index</text><text x="390" y="179.78" fill="#000" font-size="14" textLength="231.116" font-family="Helvetica">invalidTransactions   merged indexes</text><text x="390" y="193.78" fill="#000" font-size="14" textLength="209.323" font-family="Helvetica">leiosCertificate          (unchanged)</text><text x="390" y="207.78" fill="#000" font-size="14" textLength="252.875" font-family="Helvetica">leiosEndorserBlock    NEW: hash A, slot,</text><text x="526.138" y="221.78" fill="#000" font-size="14" textLength="83.282" font-family="Helvetica">txCount 5255</text><text x="390" y="235.78" fill="#000" font-size="14" font-family="Helvetica"> </text><text x="390" y="249.78" fill="#000" font-size="14" textLength="268.468" font-family="Helvetica">transactions list: 5,255 Transaction objects,</text><text x="390" y="263.78" fill="#000" font-size="14" textLength="175.082" font-family="Helvetica">blockNumber/slot = RB n+1,</text><text x="390" y="277.78" fill="#000" font-size="14" textLength="245.52" font-family="Helvetica">txCbor = bytes the peer sent for each tx</text></g><g class="entity" data-qualified-name="GMN4" id="ent0005" data-source-line="18"><path d="M325,309 L325,371 A0,0 0 0 0 325,371 L723.908,371 A0,0 0 0 0 723.908,371 L723.908,319 L713.908,309 L528.5,309 L524.5,291.174 L520.5,309 L325,309 A0,0 0 0 0 325,309" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M713.908,309 L713.908,319 L723.908,319 L713.908,309" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="331" y="324.01" fill="#000" font-size="13" textLength="181.721" font-family="Helvetica">inlineEndorserBlockTxs = false:</text><text x="331" y="337.01" fill="#000" font-size="13" textLength="205.943" font-family="Helvetica">the block is delivered as on the wire</text><text x="331" y="350.01" fill="#000" font-size="13" textLength="264.456" font-family="Helvetica">(leiosEndorserBlock is the pointer, txCount 0),</text><text x="331" y="363.01" fill="#000" font-size="13" textLength="377.908" font-family="Helvetica">and EB A arrives through onEndorserBlock(EndorserBlockEvent).</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-link-type="dependency"><polygon points="379.818,169,370.818,165,374.818,169,370.818,173,379.818,169" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M161.219,169 C221.435,169 301.977,169 374.818,169" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="208.085" y="151.01" fill="#000" font-size="13" textLength="70.084" font-family="Helvetica">merge EB A</text><text x="181" y="164.01" fill="#000" font-size="13" textLength="124.255" font-family="Helvetica">(EB transactions first)</text></g><?plantuml-src XLDDRzim3BtxLt3j9SdIhsqUrW0Tq7oXXwq3kW8zD3t8DXrpLQX0ajDam_xxA3bTd6B5T34iFPAFZtnlbbRD5mgqsfZQWrkWLwmIzqYyL5OjeC1IrTfF3VjhjK2uGhr2JtaRuofLc2VYEPHAEsozMCmbtrmZ_4e0RapDnSXOHWkVv7zeR85sPBInS9Z6a_nEF7d1NqAErbEv2M