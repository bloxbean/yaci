roke-width:1;"/><text x="520.597" y="191.01" fill="#000" font-size="13" textLength="160.418" font-family="Helvetica">onBlock(100), onBlock(101)</text><polygon points="379.532,219,389.532,223,379.532,227,383.532,223" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="33.734" y1="223" x2="385.532" y2="223" style="stroke:#181818;stroke-width:1;"/><text x="40.734" y="218.01" fill="#000" font-size="13" textLength="333.798" font-family="Helvetica">RB 102 (certifies X), RB 103, RB 104 (certifies Y), RB 105</text><polygon points="501.597,246,511.597,250,501.597,254,505.597,250" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="391.532" y1="250" x2="507.597" y2="250" style="stroke:#181818;stroke-width:1;"/><text x="398.532" y="245.01" fill="#000" font-size="13" textLength="72.274" font-family="Helvetica">RB 102..105</text><polygon points="712.739,273,722.739,277,712.739,281,716.739,277" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="513.597" y1="277" x2="718.739" y2="277" style="stroke:#181818;stroke-width:1;"/><text x="520.597" y="272.01" fill="#000" font-size="13" textLength="187.142" font-family="Helvetica">fetch X and Y (started on arrival)</text><path d="M438.05,290 L438.05,326 L589.05,326 L589.05,300 L579.05,290 L438.05,290" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M579.05,290 L579.05,300 L589.05,300 L579.05,290" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="444.05" y="305.01" fill="#000" font-size="13" textLength="89.597" font-family="Helvetica">102 waits for X;</text><text x="444.05" y="318.01" fill="#000" font-size="13" textLength="130.095" font-family="Helvetica">103..105 wait behind it</text><polygon points="44.734,346,34.734,350,44.734,354,40.734,350" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"