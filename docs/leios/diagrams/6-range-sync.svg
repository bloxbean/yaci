;"/><text x="520.597" y="480.01" fill="#000" font-size="13" textLength="183.904" font-family="Helvetica">onBlock(104 + Y), onBlock(105)</text><path d="M272.811,498 L272.811,547 L631.811,547 L631.811,508 L621.811,498 L272.811,498" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M621.811,498 L621.811,508 L631.811,508 L621.811,498" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="278.811" y="513.01" fill="#000" font-size="13" textLength="338.508" font-family="Helvetica">When the queue is full, the main connection's thread waits:</text><text x="278.811" y="526.01" fill="#000" font-size="13" textLength="315.732" font-family="Helvetica">Yaci reads from the node more slowly (back-pressure).</text><text x="278.811" y="539.01" fill="#000" font-size="13" textLength="274.581" font-family="Helvetica">EB answers still arrive, on the other connection.</text><polygon points="833.439,567,843.439,571,833.439,575,837.439,571" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="513.597" y1="571" x2="839.439" y2="571" style="stroke:#181818;stroke-width:1;"/><text x="520.597" y="566.01" fill="#000" font-size="13" textLength="307.842" font-family="Helvetica">batchDone() after the last block, same ordered queue</text><?plantuml-src TLJ1Rjim3BtxAuXUPcDkqAJD3XameCbMxB1cHNfO3FJ2s7GYHAOoIKcMlnybjukTRHSRVk8Z7nz5kwtY7LfieA8Qzze_6FPpR0Y-aZwGLoKcxa-Css1bZehNKADsr3sXdtlYaXx9ELpJlLPh1asrJxpocc21l2Pm9ouXdMfJRYFmBD_P18ojoCAMTZw7XXfZJx0oUwweIYIxQ50xP0zNSrFH5Q23UHz_HCLG6cOglJBymcs91_Bb9ek4MP_mFHIa2aJpdYIymLym6dzeOwVzs6-aZEjaZp6BVipzRXVXfoIPmVKdcCC4pX9W4SnnFhQSrjOqENYJ9VCGEfFGnHI6DpTv-nv2YipIVaaEbbcRSFfNL38D-9FWXcEfL0wplFCrlAmmWhGaKLshcFarq-th-wvxMhoTZY_gZmQ30CRY2m7hsE0Ia2ie87LUR15Z3GDQgmweiuID9p07cN384cGSKNa7jR6m_FZ28Y4cZJ2iQACab_B9uit9E87MoSWHzpR4KBJj1HLVfYBXFNYBx31EoUK1B2x0DcUGiGHBM9t-vU98ICkUaxVPcLZydtWdnA9777Uxd-LojG1-1EtIG7lvG8aHUwrZJz3qB_8x9sWerpes4NQ1fOeAX2ONAR9OrW9aQsI_j3dg4wGhBBVNEokxkBUK3OGdPeWDHx8Ed5TQ