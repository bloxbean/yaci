dependencies {
    implementation libs.netty
    implementation libs.cbor
    api libs.slf4j.api

    implementation libs.cardano.client.core

    // BlockParsingPinTest captures log events; the runtime binding comes from the root build.
    testCompileOnly libs.slf4j.reload4j
    // DijkstraBlockTest takes transaction ids with Blake2b directly, not through the code it tests.
    testImplementation libs.bouncycastle.bcprov
    // DijkstraModelsTest: parameter keys 38 and 53 round-trip with and without Jackson's JDK 8 module.
    testImplementation libs.jackson.datatype.jdk8
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yaci Core'
                description = 'Yaci Core - A Cardano mini-protocol implementation in Java'
            }
        }
    }
}
