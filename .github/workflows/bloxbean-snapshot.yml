name: Publish snapshot to the BloxBean Maven repository

# STUB on main. workflow_dispatch only offers workflows whose file exists on the default branch (main), but the run
# uses the file from the ref selected in "Run workflow". This file exists so that the real bloxbean-snapshot.yml on next
# or a next-* line (release-ops docs/12-bloxbean-maven-repository.md) can be started with that ref:
#   gh workflow run bloxbean-snapshot.yml --repo bloxbean/yaci --ref next
#   gh workflow run bloxbean-snapshot.yml --repo bloxbean/yaci --ref next-leios
#
# main builds the 0.4.x line with Gradle 7.5.1 / JDK 11 and publishes no snapshots to the BloxBean Maven repository,
# so there is nothing to run here.
#
# Keep the name and the workflow_dispatch inputs (none) identical to next's copy. Same pattern as publish-central.yml
# (release-ops templates/workflows/publish-central-stub.yml), except that this stub holds no concurrency group: it
# must never queue behind, or replace a pending, real publication. It names no environment and uses no secrets.

on:
  workflow_dispatch:

permissions: {}

jobs:
  not-on-main:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse to run on this branch
        shell: bash
        run: |
          echo "::error::main (0.4.x) publishes no snapshots to the BloxBean Maven repository." >&2
          echo "::error::Snapshots are published from next or a next-* line: run this workflow with that ref." >&2
          exit 1
