name: Manual Snapshot Push to SNAPSHOT repo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-build:
    # The job runs the selected branch's Gradle build with the Central Portal token, so only the release
    # branches (main, next, release/**) and the next-* lines (e.g. next-leios) may publish snapshots; a run
    # started on any other branch is skipped. Like release/**, next-* must be in the protected-branches and
    # release-branch-creation rulesets and in this environment's deployment branches.
    if: >-
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' ||
      startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/next-')
    # The Central Portal token is a secret of this environment.
    environment: release-staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          persist-credentials: false
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # `publish` sends a non-SNAPSHOT version to the release staging endpoint, so refuse it here.
      - name: Require a SNAPSHOT version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' gradle.properties \
            | head -1 | tr -d '[:space:]')
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Snapshot publishing requires a -SNAPSHOT version. Got: $VERSION" >&2
            exit 1
          fi
      - name: Build with Gradle
        run: ./gradlew clean build -PskipSigning=true --stacktrace
      - name: Publish package to SNAPSHOT repository
        run: ./gradlew publish -PskipSigning=true --warn --stacktrace
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
