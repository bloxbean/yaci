name: Clean, Build

# next-* are long-lived lines branched off next (e.g. next-leios). next/* can never exist while next does.
on:
  push:
    branches:
      - main
      - develop
      - develop*
      - release*
      - next
      - next-*
  pull_request:
    branches:
      - main
      - develop
      - develop*
      - release*
      - next
      - next-*

# PR builds run the pull request's own code: give it a read-only token.
permissions:
  contents: read

jobs:
  commit-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          persist-credentials: false
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build -PskipSigning=true --stacktrace
