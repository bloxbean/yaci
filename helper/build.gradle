dependencies {
    api project(':core')
    api libs.project.reactor.core

    implementation libs.cardano.client.core
    testImplementation libs.project.reactor.test

}

// Full network sync is explicitly requested and must run again against the current tip.
tasks.named('integrationTest', Test) {
    if (System.getenv('YACI_FULL_SYNC') == 'true') {
        outputs.upToDateWhen { false }
        outputs.doNotCacheIf('Full sync validates a live network') { true }
        testLogging.showStandardStreams = true
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yaci Helper'
                description = 'Yaci Helper - Helper module for Yaci (A Cardano mini-protocol implementation in Java)'
            }
        }
    }
}
